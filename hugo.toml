baseURL = "https://kumakikai.github.io/"
languageCode = "ja"
title = "ギャンカレ"
enableRobotsTXT = true
theme = "PaperMod"
timeZone = "Asia/Tokyo"

[pagination]
  pagerSize = 3

# GitHub Pages向け
canonifyURLs = true
relativeURLs = false

[params]
  description = "ギャンカレの公式サイトです。 ／ Official site for Balance Calendar app."

  # ホーム表示調整
  ShowPostSummary = true
  ShowBreadCrumbs = false
  ShowReadingTime = false

  # カスタムCSS読み込み（トップ区切り線・タイル調整用）
  customCSS = ["css/custom.css"]

  mainSections = ["notes"]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Updates"
    url = "/updates/"
    weight = 2
  [[menu.main]]
    name = "How to Use"
    url = "/htu/"
    weight = 3
  [[menu.main]]
    name = "FAQ"
    url = "/faq/"
    weight = 4
 [[menu.main]]
   name = "Notes"
   url = "/notes/"
   weight = 5