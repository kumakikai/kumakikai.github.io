{{- if partial "seo/indexable.html" . -}}
<url>
  <loc>{{ .Permalink }}</loc>
  {{- if not .Lastmod.IsZero }}<lastmod>{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}</lastmod>{{ end }}
  {{- range partial "seo/alternates.html" . }}<xhtml:link rel="alternate" hreflang="{{ .lang }}" href="{{ .url }}"/>{{ end }}
</url>
{{- end -}}
