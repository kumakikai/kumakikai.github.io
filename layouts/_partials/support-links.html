{{- $ui := index site.Data.ux site.Language.Lang -}}
<div class="support-resources"><ul class="resource-links">
{{- range partial "support-data.html" . -}}
  <li data-support-kind="{{ .kind }}"><a href="{{ .url | safeURL }}"{{ if .external }} rel="external"{{ end }}{{ if .appleEULA }} title="{{ $ui.appleEULAExternal }}"{{ end }}>
    <span class="resource-copy"><span class="resource-title">{{ .title }}{{ if .fallback }} <span lang="ja">（日本語）</span>{{ end }}</span><span class="resource-description">{{ .description }}</span>{{ if .appleEULA }}<span class="sr-only">{{ $ui.appleEULAExternal }}</span>{{ end }}</span>
    <span aria-hidden="true">{{ if .external }}↗{{ else }}→{{ end }}</span>
  </a></li>
{{- end -}}
</ul></div>
