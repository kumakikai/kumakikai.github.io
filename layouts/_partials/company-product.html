{{ $app := . }}{{ $copy := index site.Data.home site.Language.Lang }}{{ $text := index $copy.apps $app.id }}
<a class="company-product-link" data-product-option data-product-id="{{ $app.id }}" href="{{ printf "/products/%s/" $app.id | relLangURL }}"><img src="{{ $app.icon }}" width="48" height="48" alt="" loading="lazy" decoding="async"><span>{{ $text.name }}<span class="company-product-platform">{{ $text.platform }}{{ if ne $app.status "published" }} · {{ $copy.development }}{{ end }}</span></span><span aria-hidden="true">→</span></a>
