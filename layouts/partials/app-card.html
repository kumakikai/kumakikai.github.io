{{ $app := .app }}{{ $text := index .copy.apps $app.id }}
<article class="portfolio-app-card" aria-labelledby="{{ $app.id }}-name">
  <img class="app-icon" src="{{ $app.icon }}" width="52" height="52" loading="lazy" decoding="async" alt="">
  <h3 id="{{ $app.id }}-name">{{ $text.name }}</h3>
  <p>{{ $text.description }}</p>
  <div class="portfolio-card-actions">
    {{ partial "app-detail-link.html" (dict "app" $app "copy" .copy "name" $text.name) }}
    {{ if and (eq $app.status "published") $app.appStoreURL }}<a href="{{ $app.appStoreURL }}" aria-label="{{ $text.name }} — {{ .copy.store }}">App Store <span aria-hidden="true">↗</span></a>{{ end }}
  </div>
</article>
